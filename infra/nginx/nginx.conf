events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Upstream services ─────────────────────────────────────────────────
    upstream django {
        server django:8000;
    }

    upstream fastapi {
        server fastapi:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Frontend (static HTML/CSS/JS) ──────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── Django API ─────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Django Admin ───────────────────────────────────────────────
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Django static files (collected by whitenoise) ──────────────
        location /static/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Media files (user uploads, served directly) ────────────────
        location /media/ {
            alias /media/;
            expires 1h;
        }

        # ── FastAPI agent endpoints (SSE-compatible) ───────────────────
        # Note: In production, FastAPI should NOT be publicly exposed.
        # These routes are accessible in dev for debugging.
        location /agent/ {
            proxy_pass http://fastapi/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # SSE requires these settings
            proxy_buffering            off;
            proxy_cache                off;
            proxy_read_timeout         3600s;
            proxy_set_header Connection '';
            chunked_transfer_encoding  on;
        }
    }
}
