services:

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobundo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobundo}
      POSTGRES_USER: ${POSTGRES_USER:-jobundo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobundo} -d ${POSTGRES_DB:-jobundo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Ollama — local LLM runtime ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jobundo_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (requires NVIDIA Container Toolkit on host).
    # Remove the deploy block if you don't have a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django — web / auth / CRUD ────────────────────────────────────────────
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobundo_django
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI — agent API ───────────────────────────────────────────────────
  fastapi:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: jobundo_fastapi
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./agent:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx — reverse proxy + static files ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jobundo_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - media_data:/media:ro
    ports:
      - "80:80"
    depends_on:
      - django
      - fastapi

volumes:
  postgres_data:
  ollama_data:
  media_data:
